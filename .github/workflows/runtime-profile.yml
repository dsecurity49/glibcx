name: Build managed runtime profile

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated production tag
        required: true
        type: string
      profile_id:
        description: Immutable managed profile ID
        required: true
        type: string
      source_date_epoch:
        description: Reproducible Unix timestamp
        required: true
        type: string
      builder_image:
        description: ghcr.io/termux/package-builder-cgct image pinned by sha256 digest
        required: true
        type: string

permissions: {}

concurrency:
  group: runtime-profile-${{ inputs.tag }}-${{ inputs.profile_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android-patched AArch64 glibc
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      - name: Validate tag and inputs
        id: preflight
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          PROFILE_ID: ${{ inputs.profile_id }}
          SOURCE_DATE_EPOCH: ${{ inputs.source_date_epoch }}
          BUILDER_IMAGE: ${{ inputs.builder_image }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$PROFILE_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
          [[ "$SOURCE_DATE_EPOCH" =~ ^[0-9]+$ ]]
          [[ "$BUILDER_IMAGE" =~ ^ghcr\.io/termux/package-builder-cgct@sha256:[0-9a-f]{64}$ ]]
          test "$(git cat-file -t "$TAG")" = tag
          commit=$(git rev-list -n 1 "$TAG")
          version=${TAG#v}
          grep -Fqx "GLIBCX_VERSION=\"${version}\"" src/common.sh
          echo "commit=$commit" >>"$GITHUB_OUTPUT"

      - name: Set up cross-architecture execution
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build final-prefix runtime and corresponding source
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          PROFILE_ID: ${{ inputs.profile_id }}
          SOURCE_DATE_EPOCH: ${{ inputs.source_date_epoch }}
          BUILDER_IMAGE: ${{ inputs.builder_image }}
          GLIBCX_COMMIT: ${{ steps.preflight.outputs.commit }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y libarchive-tools jq
          bash profiles/build-managed-runtime.sh \
            "$PROFILE_ID" "$TAG" "$GLIBCX_COMMIT" "$BUILDER_IMAGE" \
            glibcx-runtime-profile

      - name: Validate build provenance and payload
        shell: bash
        env:
          PROFILE_ID: ${{ inputs.profile_id }}
          GLIBCX_COMMIT: ${{ steps.preflight.outputs.commit }}
        run: |
          set -euo pipefail
          jq -e --arg commit "$GLIBCX_COMMIT" \
            '.schema == 1 and .glibcx_commit == $commit' \
            glibcx-runtime-profile/build-metadata.json >/dev/null
          test -s "glibcx-runtime-profile/payload/${PROFILE_ID}.payload/profile.json"
          test -d glibcx-runtime-profile/corresponding-source

      - uses: actions/upload-artifact@v4
        with:
          name: glibcx-runtime-profile
          path: glibcx-runtime-profile
          if-no-files-found: error
          retention-days: 30
