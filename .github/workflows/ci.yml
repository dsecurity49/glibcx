name: CI

on:
  push:
    branches: ["main", "release/**"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "release/**"]

jobs:
  # ── Job 1: Shell lint + syntax ──────────────────────────────────────────────
  lint:
    name: Shell lint & syntax
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install lint dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq shellcheck

      - name: bash -n syntax check (all .sh files)
        run: |
          find . -name "*.sh" -not -path "./.git/*" | while read -r f; do
            echo "Checking: $f"
            bash -n "$f" || exit 1
          done

      - name: shellcheck
        run: |
          find . -name "*.sh" -not -path "./.git/*" | xargs shellcheck \
            --severity=warning \
            --exclude=SC2034,SC2148,SC1091

      - name: Validate accepted device reports
        run: bash ci/validate-device-results.sh

      - name: GitHub Actions workflow lint
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 \
            -ignore 'label "ubuntu-26.04-arm" is unknown' \
            -ignore 'shellcheck reported issue.*SC2016' \
            .github/workflows/*.yml

  # ── Job 2: C wrapper compile check ─────────────────────────────────────────
  c-wrapper-syntax:
    name: C wrapper compile check
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install clang
        run: sudo apt-get install -y clang

      - name: Extract and syntax-check C wrapper template
        run: |
          awk '/^#include <stdio\.h>/{found=1} found && /^C_CODE$/{exit} found{print}' src/patch.sh \
            | sed \
                -e 's|\${target_c_bytes}|0x2f, 0x74, 0x6d, 0x70, 0x2f, 0x74, 0x65, 0x73, 0x74, 0x00|g' \
                -e 's|\${patched_fp}|1_2_3_4_5|g' \
                -e 's|\${ldso_c_bytes}|0x2f, 0x6c, 0x69, 0x62, 0x2f, 0x6c, 0x64, 0x2e, 0x73, 0x6f, 0x00|g' \
                -e 's|\${library_path_c_bytes}|0x2f, 0x6c, 0x69, 0x62, 0x00|g' \
                -e 's|\${hwcaps_mask_c_bytes}|0x00|g' \
                -e 's|\${hwcaps_policy_c}|0|g' \
                -e 's|\${ssl_cert_path_c_bytes}|0x2f, 0x6e, 0x6f, 0x6e, 0x65, 0x00|g' \
                -e 's|\${env_real_c_bytes}|0x58, 0x3d, 0x31, 0x00|g' \
                -e 's|\${env_wrapper_c_bytes}|0x58, 0x3d, 0x31, 0x00|g' \
                -e 's|\${env_app_c_bytes}|0x58, 0x3d, 0x31, 0x00|g' \
                -e 's|\${env_mode_c_bytes}|0x58, 0x3d, 0x31, 0x00|g' \
                -e 's|\${env_tunables_c_bytes}|0x58, 0x3d, 0x31, 0x00|g' \
                -e 's|\${env_ssl_cert_c_bytes}|0x58, 0x3d, 0x31, 0x00|g' \
                -e 's|\${trace_marker_c_bytes}|0x58, 0x3d, 0x31, 0x00|g' \
                -e 's|\${proc_exe_shim_c_bytes}|0x00|g' \
            > /tmp/wrapper_check.c
          echo "Extracted $(wc -l < /tmp/wrapper_check.c) lines of C"
          clang -fsyntax-only \
            -Wall -Wextra -Wno-unused-parameter \
            /tmp/wrapper_check.c
          clang -O2 -Wall -Wextra -Wno-unused-parameter \
            /tmp/wrapper_check.c -o /tmp/wrapper_check
          LC_ALL=C objdump -d --disassemble=main /tmp/wrapper_check > /tmp/wrapper_main.dis
          LC_ALL=C grep -Eq '[[:space:]]br[[:space:]]+x[0-9]+' /tmp/wrapper_main.dis
          if LC_ALL=C awk '
            /[[:space:]]br[[:space:]]+x[0-9]+/ {after_transfer=1; next}
            after_transfer && /[[:space:]](ret|bl|blr)([[:space:]]|$)/ {bad=1}
            END {exit bad}
          ' /tmp/wrapper_main.dis; then
            :
          else
            echo "Compiler emitted a return/call after the no-return loader branch." >&2
            exit 1
          fi

  # ── Job 3: Verify the checked-in executable is built from source ────────────
  build:
    name: Source build consistency
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Build and compare the monolithic executable
        run: |
          bash build.sh
          cmp glibcx glibcx-bin

  # ── Job 4: End-to-end integration test on real AArch64 glibc ───────────────
  integration:
    name: End-to-end integration (AArch64 glibc)
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang file jq curl util-linux patchelf gnupg xz-utils

      - name: Run schema and state tests
        run: |
          bash ci/state_test.sh
          bash ci/elf_test.sh
          bash ci/runtime_test.sh
          bash ci/profile_builder_test.sh
          bash ci/release_assets_test.sh
          bash ci/loader_test.sh
          bash ci/repository_test.sh
          bash ci/proc_exe_test.sh
          bash ci/install_bootstrap_test.sh
          bash ci/setup_test.sh
          bash ci/provider_args_test.sh
          bash ci/provider_download_test.sh
          bash ci/provider_archive_test.sh
          bash ci/device_results_test.sh
          bash ci/device_issue_test.sh

      - name: Run integration test
        run: bash ci/integration_test.sh
